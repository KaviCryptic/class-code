<!DOCTYPE html>
<html>
   <title> google.com/kavi</title>
<head>

    <style>
        .kp , .kpp {
            color: rgb(51, 207, 255);
            margin-left: 0px;
            margin-right: 0px;
        }
        .rd  , .team {
            color: rgb(192, 0, 0);
        }
        .yll {
            color:rgb(187, 187, 1);
        }
        .gre {
            color: green;
        }
        .gdiv {
            align-items: center;
            display: block;
        }
        p {
            font-size: 100px;
            text-align: center;
            margin-left: 0px;
            margin-right: 0px;

        }
        .searchbar {
        width: 500px;
        object-position: center;
        display: inline-block;
        border-color: gray;
        
        border-radius: 20px;
        margin-top: 30px;
        font-size: 30px;
        margin-left: 500px;


        }
        .bar{
            object-position: center;
            display: inline-block;

        }





    </style>
</head>


<body>
    <div class="gdiv">
    <p><strong>
        <span class="kp">G</span>
        <span class="rd">o</span>
        <span class="yll">o</span>
        <span class="kpp">g</span>
        <span class="gre">l</span>
        <span class="team">e</span>
    </strong></p>


    </div class="bar">
    <input type="text" placeholder="search on google" class="searchbar">

</body>


</html>
